{% extends "base.html" %}
{% block content %}
{% include "_admin_header.html" %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 m-0">Edit service #{{ service.id }}</h1>
  <a href="/admin/services" class="btn btn-outline-secondary">Back</a>
</div>

<form method="post" action="/admin/services/{{ service.id }}" class="card p-3">
  <div class="row g-2">
    <div class="col-md-4">
      <label class="form-label">Pickup</label>
      <input class="form-control" name="pickup" value="{{ service.pickup }}" required />
    </div>
    <div class="col-md-4">
      <label class="form-label">Dropoff</label>
      <input class="form-control" name="dropoff" value="{{ service.dropoff }}" required />
    </div>
    <div class="col-md-2">
      <label class="form-label">Date</label>
      <input class="form-control" name="date" value="{{ service.date }}" required />
    </div>
    <div class="col-md-2">
      <label class="form-label">Time</label>
      <input class="form-control" name="pickup_time" value="{{ service.time }}" required />
    </div>
    <div class="col-md-2">
      <label class="form-label">Pax</label>
      <input type="number" class="form-control" name="pax" value="{{ service.pax }}" required />
    </div>
    <div class="col-md-4">
      <label class="form-label">Pax Name</label>
      <input class="form-control" name="paxname" value="{{ service.paxname }}" required />
    </div>
    <div class="col-md-4">
      <label class="form-label">Pax Phone</label>
      <input class="form-control" name="paxphone" value="{{ service.paxphone }}" required />
    </div>
    <div class="col-md-2">
      <label class="form-label">Subclass</label>
      <input class="form-control" name="subclass" value="{{ service.subclass }}" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Service Type</label>
      <input class="form-control" name="servicetype" value="{{ service.servicetype }}" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Car Type</label>
      <input class="form-control" name="cartype" value="{{ service.cartype }}" />
    </div>
    <div class="col-md-2">
      <label class="form-label">Price</label>
      <input type="number" step="0.01" class="form-control" name="price" value="{{ service.price }}" />
    </div>
    <div class="col-md-2">
      <label class="form-label">Status</label>
      <input type="number" class="form-control" name="service_status" value="{{ service.service_status }}" />
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary">Save</button>
  </div>
</form>
{% endblock %}
