{% extends "base.html" %}
{% block content %}
{% include "_admin_header.html" %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 m-0">Edit service #{{ service.id }}</h1>
  <a href="/admin/services" class="btn btn-outline-secondary">Back</a>
</div>

<form method="post" action="/admin/services/{{ service.id }}" class="card p-3">
  <div class="row g-2">
    {% for key, value in service.items() %}
      {% if key != "id" %}
      <div class="col-md-4">
        <label class="form-label">{{ key }}</label>
        {% if key in enum_options %}
        <select class="form-select form-select-sm" name="{{ key }}">
          {% for enum_value, enum_label in enum_options[key] %}
          <option value="{{ enum_value }}" {% if value|string == enum_value %}selected{% endif %}>
            {{ enum_value }} - {{ enum_label }}
          </option>
          {% endfor %}
        </select>
        {% elif key == "status" %}
        <input class="form-control form-control-sm" name="{{ key }}" value="{{ value }}" readonly />
        {% else %}
        <input class="form-control form-control-sm" name="{{ key }}" value="{{ value }}" />
        {% endif %}
      </div>
      {% endif %}
    {% endfor %}
  </div>
  <div class="mt-3">
    <button class="btn btn-primary">Save</button>
  </div>
</form>
{% endblock %}
