{% extends "base.html" %}
{% block content %}
{% include "_admin_header.html" %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 m-0">{{ form_title }}</h1>
  <a href="/admin/drivers" class="btn btn-outline-secondary">Back</a>
</div>

<form method="post" action="{{ form_action }}" class="card p-3">
  <div class="row g-2">
    {% for key, value in driver.items() %}
      <div class="col-md-4">
        <label class="form-label">{{ key }}</label>
        {% if key == "id" and value %}
        <input class="form-control form-control-sm" name="{{ key }}" value="{{ value }}" readonly />
        {% else %}
        <input class="form-control form-control-sm" name="{{ key }}" value="{{ value }}" />
        {% endif %}
      </div>
    {% endfor %}
  </div>
  <div class="mt-3">
    <button class="btn btn-primary">Save</button>
  </div>
</form>
{% endblock %}
