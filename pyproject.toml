[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nccgest"
version = "0.1.0"
description = "Sync and async Python client for NCCGEST REST API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "Oleg Klishin" }
]
keywords = ["nccgest", "api", "rest", "transport", "booking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed"
]
dependencies = [
  "httpx>=0.27,<1"
]

[project.urls]
Homepage = "https://github.com/klishinoleg/nccgest"
Repository = "https://github.com/klishinoleg/nccgest"
Issues = "https://github.com/klishinoleg/nccgest/issues"

[project.optional-dependencies]
mock = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "Jinja2>=3.1,<4",
  "uvicorn>=0.35,<1",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.9",
]
dev = [
  "build>=1.2.2",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "Jinja2>=3.1,<4",
  "mypy>=1.14.0",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.9",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "types-PyYAML>=6.0.12",
  "twine>=6.0.0",
  "uvicorn>=0.35,<1",
]

[project.scripts]
nccgest-mock = "nccgest.mock_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nccgest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
packages = ["nccgest"]
mypy_path = "src"
